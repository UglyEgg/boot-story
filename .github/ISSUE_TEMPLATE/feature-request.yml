name: Feature request
description: Suggest a focused improvement to Boot Story
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Boot Story aims to make systemd boot behavior understandable through progressive disclosure while keeping collection local, bounded, unprivileged, and read-only.

        For major behavioral or visual changes, please also read the [contributing guide](https://github.com/UglyEgg/boot-story/blob/main/CONTRIBUTING.md).

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Boot overview
        - Critical path or long activations
        - Unit deep dive
        - History and comparison
        - Theme, layout, or accessibility
        - Packaging or distribution support
        - Other
    validations:
      required: true

  - type: textarea
    id: need
    attributes:
      label: What problem would this solve?
      description: Describe the user need or confusing situation before proposing a control or implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Explain what the user would see or do and how deeper detail should appear when needed.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any simpler presentation, existing system tool, or workaround you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sketches, screenshots, example output, or related references if useful.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for a similar request.
          required: true
        - label: This request is about understanding boot behavior rather than unrestricted system service control.
          required: true
